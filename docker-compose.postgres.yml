services:
  app:
    image: cfluegel/flask-consumption:latest
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_CONFIG=config.ProductionConfig
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - API_KEY=${API_KEY:-change-me-in-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-consumption}:${POSTGRES_PASSWORD:-consumption}@db:5432/${POSTGRES_DB:-consumption}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-consumption}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-consumption}
      - POSTGRES_DB=${POSTGRES_DB:-consumption}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-consumption}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
