<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}Verbrauchstracker{% endblock %}</title>

    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Verbrauch">
    <meta name="theme-color" content="#b8860b">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Icons -->
    <link rel="apple-touch-icon" href="{{ url_for('pwa.static', filename='icons/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('pwa.static', filename='icons/icon-192.png') }}">

    <!-- Manifest -->
    <link rel="manifest" href="{{ url_for('pwa.manifest') }}">

    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('pwa.static', filename='pwa.css') }}">
</head>
<body>
    <header class="pwa-header">
        <h1>{% block header_title %}Verbrauchstracker{% endblock %}</h1>
        {% block header_actions %}{% endblock %}
    </header>

    <main class="pwa-main">
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Laden...</p>
        </div>
        <div id="error" class="error-message hidden"></div>
        <div id="content">
            {% block content %}{% endblock %}
        </div>
    </main>

    <nav class="pwa-nav">
        <a href="{{ url_for('pwa.index') }}" class="nav-item {% block nav_home %}{% endblock %}">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Start</span>
        </a>
        <a href="{{ url_for('pwa.setup') }}" class="nav-item {% block nav_setup %}{% endblock %}">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22l-1.92 3.32c-.12.21-.07.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            <span>Einstellung</span>
        </a>
    </nav>

    <script src="{{ url_for('pwa.static', filename='pwa.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
