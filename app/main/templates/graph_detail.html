{% extends 'base.html' %}

{% block content %}
  <style>
    .graph-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .graph-header h1 {
      margin: 0;
    }
    .back-link {
      color: var(--sand-accent);
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .full-chart-container {
      background: var(--sand-medium);
      padding: 1.5rem;
      border-radius: 8px;
      height: calc(100vh - 200px);
      min-height: 400px;
    }
    .chart-canvas-wrapper {
      height: 100%;
      position: relative;
    }
  </style>

  <div class="graph-header">
    <h1>{{ meter.name }} - Verbrauch</h1>
    <a href="{{ url_for('main.graphs') }}" class="back-link">&larr; Zurück zu Diagramme</a>
  </div>

  {% if consumption_data %}
    <div class="full-chart-container">
      <div class="chart-canvas-wrapper">
        <canvas id="full-chart"></canvas>
      </div>
    </div>

    <script>
      const chartColors = {
        line: '#b8860b',
        fill: 'rgba(184, 134, 11, 0.2)',
        grid: '#d4a574',
        text: '#5c4033',
        tempBand: 'rgba(70, 130, 180, 0.2)',
        tempLine: '#4682b4',
        tempAvg: '#1e90ff'
      };

      const labels = {{ consumption_data | map(attribute=0) | list | tojson }};
      const rawValues = {{ consumption_data | map(attribute=1) | list | tojson }};
      const values = rawValues.map(v => v === null ? null : v);
      const numericValues = values.filter(v => v !== null);
      const minVal = numericValues.length > 0 ? Math.min(...numericValues) : 0;
      const maxVal = numericValues.length > 0 ? Math.max(...numericValues) : 100;
      const padding = (maxVal - minVal) * 0.1 || 10;

      // Weather data
      const weatherData = {{ weather_data | tojson }};
      const tempMin = weatherData.map(w => w.temp_min ?? null);
      const tempMax = weatherData.map(w => w.temp_max ?? null);
      const tempAvg = weatherData.map(w => w.temp_avg ?? null);
      const hasWeatherData = tempAvg.some(v => v !== null);

      // Build datasets
      const datasets = [{
        label: '{{ meter.name }}',
        data: values,
        borderColor: chartColors.line,
        backgroundColor: chartColors.fill,
        fill: true,
        tension: 0.3,
        spanGaps: true,
        pointBackgroundColor: chartColors.line,
        pointRadius: 4,
        yAxisID: 'y',
        order: 3
      }];

      // Add temperature datasets if weather data exists
      if (hasWeatherData) {
        datasets.push(
          {
            label: 'Temp Min',
            data: tempMin,
            borderColor: 'transparent',
            backgroundColor: 'transparent',
            pointRadius: 0,
            yAxisID: 'y-temp',
            order: 2
          },
          {
            label: 'Temp Max',
            data: tempMax,
            borderColor: chartColors.tempLine,
            backgroundColor: chartColors.tempBand,
            fill: '-1',
            tension: 0.3,
            pointRadius: 0,
            yAxisID: 'y-temp',
            order: 1
          },
          {
            label: 'Temperatur Ø',
            data: tempAvg,
            borderColor: chartColors.tempAvg,
            backgroundColor: 'transparent',
            borderWidth: 2,
            tension: 0.3,
            pointRadius: 2,
            yAxisID: 'y-temp',
            order: 0
          }
        );
      }

      // Build scales
      const scales = {
        x: {
          ticks: {
            color: chartColors.text,
            maxRotation: 45,
            minRotation: 45
          },
          grid: {
            color: chartColors.grid,
            drawBorder: false
          }
        },
        y: {
          position: 'left',
          min: Math.max(0, minVal - padding),
          max: maxVal + padding,
          ticks: {
            color: chartColors.text,
            callback: function(value) {
              return value.toLocaleString('de-DE');
            }
          },
          grid: {
            color: chartColors.grid,
            drawBorder: false
          },
          title: {
            display: true,
            text: '{{ meter.unit }}',
            color: chartColors.text
          }
        }
      };

      // Add temperature axis if weather data exists
      if (hasWeatherData) {
        scales['y-temp'] = {
          position: 'right',
          grid: { drawOnChartArea: false },
          ticks: {
            color: chartColors.tempLine,
            callback: function(value) {
              return value + '°C';
            }
          },
          title: {
            display: true,
            text: 'Temperatur (°C)',
            color: chartColors.tempLine
          }
        };
      }

      const ctx = document.getElementById('full-chart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: hasWeatherData,
              labels: {
                filter: function(item) {
                  return item.text !== 'Temp Min';
                }
              }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  if (context.raw === null) return 'Keine Daten';
                  if (context.dataset.yAxisID === 'y-temp') {
                    return context.dataset.label + ': ' + context.raw.toLocaleString('de-DE') + '°C';
                  }
                  return context.dataset.label + ': ' + context.raw.toLocaleString('de-DE') + ' {{ meter.unit }}';
                }
              }
            }
          },
          scales: scales
        }
      });
    </script>
  {% else %}
    <p>Keine Verbrauchsdaten vorhanden.</p>
  {% endif %}
{% endblock %}
